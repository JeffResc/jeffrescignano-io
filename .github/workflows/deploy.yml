name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: 'package.json'
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Build
      run: pnpm run build
      env:
        NODE_ENV: production
        PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

    - name: Verify built pages
      run: |
        shopt -s globstar nullglob
        pages=(dist/client/**/*.html)
        if [ ${#pages[@]} -eq 0 ]; then
          echo "::error::No HTML pages were built"
          exit 1
        fi
        status=0
        for page in "${pages[@]}"; do
          size=$(wc -c < "$page")
          if [ "$size" -lt 1024 ]; then
            echo "::error file=$page::Page is only $size bytes"
            status=1
          elif ! head -c 15 "$page" | grep -qi '<!DOCTYPE html'; then
            echo "::error file=$page::Page does not start with a DOCTYPE"
            status=1
          fi
        done
        echo "Checked ${#pages[@]} pages"
        exit $status

    - name: Deploy Preview to Cloudflare Workers
      id: deploy-preview
      if: github.event_name == 'pull_request'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

    - name: Comment Preview Link
      if: github.event_name == 'pull_request'
      run: |
        PREVIEW_URL="https://pr-${{ github.event.pull_request.number }}-jeffrescignano-io.jeffresc.workers.dev"

        gh pr comment ${{ github.event.pull_request.number }} --body "🚀 **Frontend Preview deployed!**

        Preview URL: $PREVIEW_URL

        This preview was automatically generated for commit ${{ github.sha }}."
      env:
        GH_TOKEN: ${{ github.token }}

    
    - name: Deploy to Cloudflare Workers
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

